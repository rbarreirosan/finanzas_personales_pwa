<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Finanzas Personales</title>
    <meta name="description" content="App de finanzas personales" />

    <!-- Tema / color de la barra del sistema -->
    <meta name="theme-color" content="#0F172A" />

    <!-- Manifest para instalabilidad (Android / escritorio) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS: "Agregar a pantalla de inicio" en Safari, pantalla completa -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzas" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  </head>
  <body>
    <!-- Fondo: orbes de color desenfocados para que el vidrio tenga qué refractar -->
    <div class="bg" aria-hidden="true">
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>
      <span class="orb orb-3"></span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
